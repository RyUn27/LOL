  <script>
  const members = [
  { name: "SeoYeon", img: "images/SeoYeon.webp", link: "member_details.html#seoyeon" },
  { name: "HyeRin", img: "images/HyeRin.webp", link: "member_details.html#hyerin" },
  { name: "JiWoo", img: "images/JiWoo.webp", link: "member_details.html#jiwoo" },

  { name: "YooYeon", img: "images/YooYeon.webp", link: "member_details.html#yooyeon" },
  { name: "SooMin", img: "images/SooMin.webp", link: "member_details.html#soomin" },
  { name: "NaKyoung", img: "images/NaKyoung.webp", link: "member_details.html#nakyoung" },
  { name: "YuBin", img: "images/YuBin.webp", link: "member_details.html#yubin" },
  { name: "Kaede", img: "images/Kaede.webp", link: "member_details.html#kaede" },
  { name: "DaHyun", img: "images/DaHyun.webp", link: "member_details.html#dahyun" },
  { name: "Kotone", img: "images/Kotone.webp", link: "member_details.html#kotone" },
  { name: "YeonJi", img: "images/YeonJi.webp", link: "member_details.html#yeonji" },
  { name: "Nien", img: "images/Nien.webp", link: "member_details.html#nien" },
  { name: "SoHyun", img: "images/SoHyun.webp", link: "member_details.html#sohyun" },
  { name: "SeoAh", img: "images/SeoAh.webp", link: "member_details.html#seoah" },
  { name: "JiYeon", img: "images/JiYeon.webp", link: "member_details.html#jiyeon" },
  { name: "Xinyu", img: "images/XinYu.webp", link: "member_details.html#xinyu" },
  { name: "Mayu", img: "images/Mayu.webp", link: "member_details.html#mayu" },
  { name: "Lynn", img: "images/Lynn.webp", link: "member_details.html#lynn" },
  { name: "JooBin", img: "images/JooBin.webp", link: "member_details.html#joobin" },
  { name: "HaYeon", img: "images/HaYeon.webp", link: "member_details.html#hayeon" },
  { name: "ShiOn", img: "images/ShiOn.webp", link: "member_details.html#shion" },
  { name: "ChaeYeon", img: "images/ChaeYeon.webp", link: "member_details.html#chaeyeon" },
  { name: "Sullin", img: "images/Sullin.webp", link: "member_details.html#sullin" }
];

  const grid = document.getElementById("memberGrid");

  let currentMembers = [];

  // 🔹 Get random member not already shown
  function getRandomMember() {
    let available = members.filter(m => !currentMembers.includes(m));
    return available[Math.floor(Math.random() * available.length)];
  }

  // 🔹 Create card
function createCard(member) {
  const a = document.createElement("a");
  a.href = member.link;
  a.className = "member-card fade-in";

  a.innerHTML = `
    <img src="${member.img}" alt="${member.name}">
    <h3>${member.name}</h3>
  `;

  return a;
}

  // 🔹 Initial 4 members
  function loadInitial() {
    for (let i = 0; i < 4; i++) {
      let random = getRandomMember();
      currentMembers.push(random);
      grid.appendChild(createCard(random));
    }
  }

  // 🔹 Replace random card
  function replaceRandomCard() {
    const cards = document.querySelectorAll(".member-card");
    const randomIndex = Math.floor(Math.random() * cards.length);
    const oldCard = cards[randomIndex];

    oldCard.classList.add("fade-out");

    setTimeout(() => {
      const newMember = getRandomMember();

      currentMembers[randomIndex] = newMember;

      const newCard = createCard(newMember);
      grid.replaceChild(newCard, oldCard);
    }, 400);
  }

  // 🔹 Auto change every 3 seconds
  setInterval(replaceRandomCard, 5000);

  loadInitial();
  </script>
  <script src="script.js"></script>
