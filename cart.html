<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/webp" href="images/tripleS_icon.webp"/>
  <title>tripleS</title>
  <link rel="stylesheet" href="style.css"/>

  <style>
    .cart-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    h1 { text-align: center; margin: 30px 0 40px; color: #eee; font-size: 2.2rem; }
    .cart-table { width: 100%; border-collapse: separate; border-spacing: 0; background: #111; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .cart-table th, .cart-table td { padding: 16px 12px; text-align: center; border-bottom: 1px solid #222; }
    .cart-table th { background: #1a1a1a; color: #ff4d4d; font-weight: bold; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 0.5px; }
    .cart-table td { color: #ddd; }
    .cart-table img { height: 90px; border-radius: 8px; object-fit: cover; border: 1px solid #333; }
    .qty-control { display: inline-flex; align-items: center; background: #222; border-radius: 6px; overflow: hidden; }
    .qty-btn { background: #333; color: white; border: none; padding: 8px 14px; font-size: 1.1rem; cursor: pointer; transition: background 0.2s; }
    .qty-btn:hover { background: #444; }
    .qty-btn:disabled { background: #2a2a2a; cursor: not-allowed; opacity: 0.6; }
    .qty-display { min-width: 40px; text-align: center; font-weight: bold; color: #ff4d4d; }
    .remove-btn { background: #c0392b; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .remove-btn:hover { background: #e74c3c; transform: translateY(-1px); }
    .empty-cart { text-align: center; padding: 80px 20px; color: #777; font-size: 1.3rem; background: #111; border-radius: 12px; margin: 40px 0; }
    .cart-summary { display: flex; justify-content: space-between; align-items: center; margin: 30px 0 60px 0; padding: 0 10px; flex-wrap: wrap; gap: 20px; }
    .grand-total { font-size: 1.7rem; color: #eee; }
    .grand-total strong { color: #ff4d4d; }
    .checkout-btn { background: #ff4d4d; color: white; border: none; padding: 14px 32px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.25s; }
    .checkout-btn:hover { background: #e63939; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 77, 77, 0.35); }
    .checkout-btn:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; }

    /* Cart icon badge */
    .cart-icon {
      position: relative;
      font-size: 1.6rem;
      text-decoration: none;
      color: white;
      margin-right: 20px;
    }

    .cart-count {
      position: absolute;
      top: -10px;
      right: -12px;
      background: #ff4d4d;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* ===============================
   TABLET
================================ */
@media (max-width: 1024px) {

  .cart-container {
    margin: 30px auto;
  }

  h1 {
    font-size: 2rem;
  }

  .cart-table img {
    height: 75px;
  }

}


/* ===============================
   MOBILE
================================ */
@media (max-width: 768px) {

  .cart-container {
    margin: 20px auto;
    padding: 0 14px;
  }

  h1 {
    font-size: 1.6rem;
    margin: 20px 0 30px;
  }

  /* TABLE → SCROLLABLE */
  .cart-table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }

  .cart-table th,
  .cart-table td {
    font-size: 0.9rem;
    padding: 12px 10px;
  }

  .cart-table img {
    height: 65px;
  }

  /* QTY CONTROLS BIGGER FOR TOUCH */
  .qty-btn {
    padding: 10px 16px;
    font-size: 1.2rem;
  }

  .qty-display {
    min-width: 36px;
    font-size: 1rem;
  }

  .remove-btn {
    padding: 10px 16px;
    font-size: 0.85rem;
  }

  /* SUMMARY STACK */
  .cart-summary {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
    gap: 16px;
    margin: 30px 0 50px;
  }

  .grand-total {
    font-size: 1.4rem;
  }

  .checkout-btn {
    width: 100%;
    font-size: 1.05rem;
    padding: 15px;
  }

  .empty-cart {
    font-size: 1.1rem;
    padding: 60px 20px;
  }

}


/* ===============================
   SMALL PHONES
================================ */
@media (max-width: 480px) {

  h1 {
    font-size: 1.4rem;
  }

  .cart-table th,
  .cart-table td {
    font-size: 0.85rem;
    padding: 10px 8px;
  }

  .grand-total {
    font-size: 1.25rem;
  }

  .checkout-btn {
    font-size: 1rem;
  }

  .cart-icon {
    font-size: 1.4rem;
  }

  .cart-count {
    width: 18px;
    height: 18px;
    font-size: 0.65rem;
    top: -8px;
    right: -10px;
  }

}
  </style>
</head>
<body>

<!-- Navbar -->
<header>
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html"><img src="images/tripleS_logo.png" alt="tripleS Logo"></a>
    </div>

    <ul class="nav-center">
      <li><a href="index.html">Home</a></li>
      <li><a href="members.html">Members</a></li>
      <li><a href="albums.html">Albums</a></li>
      <li><a href="game.html">Game</a></li>
      <li><a href="overview.html">Overview</a></li>
      <li id="shopNav" style="display:none;"><a href="shop.html">Shop</a></li>
      <li id="adminNav" style="display:none;"><a href="admin.html">Admin</a></li>

    <div class="nav-right">
      <!-- Cart Icon with Badge -->
      <a href="cart.html" id="cartIcon" class="cart-icon" style="display:none;">
        🛒
        <span id="cartCountBadge" class="cart-count" style="display:none;">0</span>
      </a>

      <a href="login.html" id="loginBtn" class="signin-btn">Sign in/up</a>

      <div class="nav-profile" id="profileMenu" style="display:none;">
        <img src="images/Profile_avatar.png" class="profile-img" onclick="toggleDropdown()" alt="Profile">
        <div class="dropdown" id="dropdown">
          <p class="dropdown-user" id="dropdownUsername"></p>
          <a href="admin.html" id="adminLink" style="display:none;">Admin Dashboard</a>
          <a href="order.html" id="myOrdersLink">My Orders</a>
          <a href="checkout.html" id="checkoutLink">Checkout</a>
          <div class="divider" style="height:1px; background:rgba(255,255,255,0.1); margin:6px 0;"></div>
          <a href="#" onclick="logout()">Logout</a>
        </div>
      </div>
    </div>
  </nav>
</header>

<!-- Breadcrumb -->
<div class="breadcrumb">
  <a href="index.html">Home</a>
  <span> / </span>
  <span class="current">Cart</span>
</div>

<div class="cart-container">
  <h1>Your Cart</h1>

  <table class="cart-table" id="cartTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Image</th>
        <th>Item</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="empty-cart" id="emptyMessage" style="display:none;">
    Your cart is empty.<br><br>
    <a href="shop.html" style="color:#ff4d4d; text-decoration:underline;">Continue shopping →</a>
  </div>

  <div class="cart-summary" id="cartSummary" style="display:none;">
    <div class="grand-total" id="grandTotal"></div>
    <button class="checkout-btn" id="checkoutBtn">Checkout</button>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
//  CART PAGE – fixed user check + stock restore + dropdown
// ────────────────────────────────────────────────

let currentUser = JSON.parse(localStorage.getItem("tripleSCurrentUser"));

if (!currentUser) {
  alert("Please login first");
  window.location.href = "login.html";
  // Exit script early
  throw new Error("User not logged in");
}

// Elements
const loginBtn       = document.getElementById("loginBtn");
const profileMenu    = document.getElementById("profileMenu");
const dropdown       = document.getElementById("dropdown");
const dropdownUsername = document.getElementById("dropdownUsername");
const adminLink      = document.getElementById("adminLink");
const shopNav        = document.getElementById("shopNav");
const adminNav       = document.getElementById("adminNav");
const cartIcon       = document.getElementById("cartIcon");
const cartCountBadge = document.getElementById("cartCountBadge");
const checkoutLink   = document.getElementById("checkoutLink");

function updateNav() {
  loginBtn.style.display = "none";
  profileMenu.style.display = "block";
  dropdownUsername.textContent = currentUser.username || "User";
  shopNav.style.display = "block";
  cartIcon.style.display = "inline-block";

  if (currentUser.role === "admin") {
    adminLink.style.display = "block";
    adminNav.style.display = "block";
  }

  updateCartDisplay();
}

function toggleDropdown() {
  dropdown.classList.toggle("show");
}

function logout() {
  localStorage.removeItem("tripleSCurrentUser");
  window.location.href = "index.html";
}

// Cart badge + checkout link status
function updateCartDisplay() {
  let cart = JSON.parse(localStorage.getItem("tripleSCart")) || [];
  let userCart = cart.filter(item => item.user === currentUser.username);
  let totalItems = userCart.reduce((sum, item) => sum + (item.qty || 0), 0);

  if (totalItems > 0) {
    cartCountBadge.textContent = totalItems > 99 ? "99+" : totalItems;
    cartCountBadge.style.display = "flex";
    if (checkoutLink) {
      checkoutLink.classList.remove("disabled");
      checkoutLink.style.pointerEvents = "auto";
      checkoutLink.style.color = "#ff4d4d";
    }
  } else {
    cartCountBadge.style.display = "none";
    if (checkoutLink) {
      checkoutLink.classList.add("disabled");
      checkoutLink.style.pointerEvents = "none";
      checkoutLink.style.color = "#777";
    }
  }
}

function loadCart() {
  let cart = JSON.parse(localStorage.getItem("tripleSCart")) || [];
  let userCart = cart.filter(item => item.user === currentUser.username);

  const tbody = document.querySelector("#cartTable tbody");
  tbody.innerHTML = "";

  const emptyMessage = document.getElementById("emptyMessage");
  const cartSummary  = document.getElementById("cartSummary");
  const grandTotalEl = document.getElementById("grandTotal");
  const checkoutBtn  = document.getElementById("checkoutBtn");

  if (userCart.length === 0) {
    emptyMessage.style.display = "block";
    cartSummary.style.display = "none";
    updateCartDisplay();
    return;
  }

  emptyMessage.style.display = "none";
  cartSummary.style.display = "flex";

  let grandTotal = 0;

  userCart.forEach((item, idx) => {
    const total = (item.price || 0) * (item.qty || 0);
    grandTotal += total;

    tbody.innerHTML += `
      <tr>
        <td>${idx + 1}</td>
        <td><img src="${item.img || 'images/placeholder.jpg'}" alt="${item.name || 'Item'}" onerror="this.src='images/placeholder.jpg'"></td>
        <td>${item.name || 'Unnamed'}</td>
        <td>฿${Number(item.price || 0).toLocaleString("th-TH")}</td>
        <td>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${idx}, -1)" ${item.qty <= 1 ? 'disabled' : ''}>-</button>
            <span class="qty-display">${item.qty || 0}</span>
            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
          </div>
        </td>
        <td>฿${total.toLocaleString("th-TH")}</td>
        <td><button class="remove-btn" onclick="removeItem(${idx})">Remove</button></td>
      </tr>
    `;
  });

  grandTotalEl.innerHTML = `<strong>Grand Total: ฿${grandTotal.toLocaleString("th-TH")}</strong>`;

  checkoutBtn.disabled = grandTotal <= 0;
  updateCartDisplay();
}

// Restore stock when qty changes or item removed
function restoreStock(identifier, qtyToRestore) {
  let photocards = JSON.parse(localStorage.getItem("tripleSPhotocards")) || [];

  const matchingCard = photocards.find(card =>
    `${(card.memberName || '').trim()}-${String(card.memberNumber || '?').trim()}` === identifier
  );

  if (matchingCard) {
    matchingCard.qty = Number(matchingCard.qty || 0) + Number(qtyToRestore);
    localStorage.setItem("tripleSPhotocards", JSON.stringify(photocards));
  }
}

function changeQty(userCartIndex, delta) {
  let cart = JSON.parse(localStorage.getItem("tripleSCart")) || [];

  let count = 0;
  let realIndex = -1;
  let targetItem = null;

  for (let i = 0; i < cart.length; i++) {
    if (cart[i].user === currentUser.username) {
      if (count === userCartIndex) {
        realIndex = i;
        targetItem = cart[i];
        break;
      }
      count++;
    }
  }

  if (realIndex === -1 || !targetItem) return;

  const oldQty = Number(targetItem.qty || 0);
  let newQty = oldQty + delta;

  if (newQty < 1) newQty = 1;

  // Restore stock if qty decreased
  if (newQty < oldQty) {
    const qtyReduced = oldQty - newQty;
    restoreStock(targetItem.productIdentifier, qtyReduced);
  }

  targetItem.qty = newQty;

  localStorage.setItem("tripleSCart", JSON.stringify(cart));
  loadCart();
}

function removeItem(userCartIndex) {
  let cart = JSON.parse(localStorage.getItem("tripleSCart")) || [];

  let count = 0;
  let realIndex = -1;
  let targetItem = null;

  for (let i = 0; i < cart.length; i++) {
    if (cart[i].user === currentUser.username) {
      if (count === userCartIndex) {
        realIndex = i;
        targetItem = cart[i];
        break;
      }
      count++;
    }
  }

  if (realIndex === -1 || !targetItem) return;

  // Restore full quantity
  restoreStock(targetItem.productIdentifier, targetItem.qty || 0);

  cart.splice(realIndex, 1);
  localStorage.setItem("tripleSCart", JSON.stringify(cart));
  loadCart();
}

// Checkout redirect
document.getElementById("checkoutBtn").addEventListener("click", () => {
  const cart = JSON.parse(localStorage.getItem("tripleSCart")) || [];
  const userCart = cart.filter(item => item.user === currentUser.username);

  if (userCart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  window.location.href = "checkout.html";
});

document.addEventListener("DOMContentLoaded", () => {
  updateNav();
  loadCart();
});
</script>
<script src="script.js"></script>
</body>
</html>
